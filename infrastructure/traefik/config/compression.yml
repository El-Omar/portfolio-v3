http:
  middlewares:
    compress:
      compress:
        # Enable both gzip and brotli compression
        brotli: true
        contentTypes:
          - text/html
          - text/plain
          - text/css
          - text/javascript
          - text/xml
          - application/javascript
          - application/json
          - application/xml
          - application/xhtml+xml
          - application/rss+xml
          - application/atom+xml
          - font/woff
          - font/woff2
          - image/svg+xml
        # Minimum size to trigger compression
        minResponseBodyBytes: 1024 