http:
  middlewares:
    compress:
      compress:
        minResponseBodyBytes: 1024
        encodings:
          - zstd
          - br
          - gzip
        includedContentTypes:
          - text/html
          - text/plain
          - text/css
          - text/javascript
          - text/xml
          - application/javascript
          - application/json
          - application/xml
          - application/xhtml+xml
          - application/rss+xml
          - application/atom+xml
          - font/woff
          - font/woff2
          - image/svg+xml
        defaultEncoding: br