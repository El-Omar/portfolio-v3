## Traefik Static Configuration
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  
  websecure:
    address: ":443"

# API and dashboard
api:
  dashboard: true

# Docker provider configuration
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    directory: "/etc/traefik/config"
    watch: true

# SSL certificate resolver
certificatesResolvers:
  letsencrypt:
    acme:
      email: elomar.sami@gmail.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

# Enable access logs
accessLog: {}

# Log level
log:
  level: INFO